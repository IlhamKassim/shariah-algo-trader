name: Shariah Algo Trader Daily Run

on:
  schedule:
    # Run every Monday to Friday at 13:35 UTC (which is 9:35 AM EST/EDT)
    # This allows a 5-minute buffer after NYSE market open (09:30 AM EST)
    - cron: '35 13 * * 1-5'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions UI

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync

      - name: Run daily compliance check and rebalance
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          ALPACA_BASE_URL: https://paper-api.alpaca.markets # Or https://api.alpaca.markets for live
          ETF_SYMBOL: SPUS
          TOP_N: 20
        run: uv run python run_daily.py
