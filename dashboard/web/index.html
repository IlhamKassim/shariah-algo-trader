    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "How does the engine enforce AAOIFI Standard No. 21 compliance daily?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Our core engine runs an automated Compliance Audit at 09:30 AM ET before market execution. It synchronizes with daily S&P 500 Shariah constituent databases and cross-verifies financial metrics: Interest-Bearing Debt / Total Assets (<33%), Cash & Interest Securities / Assets (<33%), and 100% Core Business Activity Screening."
          }
        },
        {
          "@type": "Question",
          "name": "Is there any leverage, short-selling, or interest (Riba) involved?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Strictly zero. ShariahTrading operates exclusively on a 100% Long-Only Spot Equity basis. Options, futures, margin trading, short positions, and interest-bearing fixed-income instruments are hard-blocked at the algorithmic execution layer."
          }
        },
        {
          "@type": "Question",
          "name": "What occurs if an active portfolio stock becomes non-compliant?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "If a company's debt or cash ratios exceed the 33% threshold due to quarterly earnings updates or market cap swings, the compliance engine flags an immediate 'Compliance Exit Liquidation' order, selling 100% of the position on the next market open."
          }
        },
        {
          "@type": "Question",
          "name": "How does the Multi-Factor Quantitative Strategy outperform passive Shariah ETFs?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Rather than market-cap weighting where mega-caps dominate portfolio concentration, our quantitative model ranks compliant stocks across 4 proven factor metrics: Momentum, Quality (ROE), Low Volatility, and Value. The system rebalances monthly into the top 20 ranked equities."
          }
        },
        {
          "@type": "Question",
          "name": "How is dividend purification calculated for non-permissible income?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "For companies with minor incidental interest income (<5%), the system automatically calculates the exact purification percentage per dividend payout and logs the required charitable donation amount directly inside your Activity Log."
          }
        }
      ]
    }
    </script>
